config-version = 2
start-at-login = false
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = []
on-mode-changed = []

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-f = 'fullscreen'

# focus left/down/up/right handled by Karabiner (ctrl-hjkl) with WezTerm passthrough
# alt-shift-h = 'focus left'
# alt-shift-j = 'focus down'
# alt-shift-k = 'focus up'
# alt-shift-l = 'focus right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-b = 'workspace B'
alt-c = 'workspace C'
alt-m = 'workspace M'
alt-o = 'workspace O'
alt-t = 'workspace T'
alt-y = 'workspace Y'

alt-tab = 'workspace-back-and-forth'

# ---------------------------------------------
# --- Service mode
# ---------------------------------------------
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# focus handled by Karabiner (ctrl-hjkl)
# alt-shift-h = 'focus left'
# alt-shift-j = 'focus down'
# alt-shift-k = 'focus up'
# alt-shift-l = 'focus right'

shift-h = 'join-with left'
shift-j = 'join-with down'
shift-k = 'join-with up'
shift-l = 'join-with right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
h = 'move left'
j = 'move down'
k = 'move up'
l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
1 = ['move-node-to-workspace 1', 'mode main']
2 = ['move-node-to-workspace 2', 'mode main']
3 = ['move-node-to-workspace 3', 'mode main']
4 = ['move-node-to-workspace 4', 'mode main']
5 = ['move-node-to-workspace 5', 'mode main']
6 = ['move-node-to-workspace 6', 'mode main']
7 = ['move-node-to-workspace 7', 'mode main']
8 = ['move-node-to-workspace 8', 'mode main']
9 = ['move-node-to-workspace 9', 'mode main']
b = ['move-node-to-workspace B', 'mode main']
c = ['move-node-to-workspace C', 'mode main']
m = ['move-node-to-workspace M', 'mode main']
o = ['move-node-to-workspace O', 'mode main']
t = ['move-node-to-workspace T', 'mode main']
y = ['move-node-to-workspace Y', 'mode main']

left = 'workspace prev --wrap-around'
right = 'workspace next --wrap-around'

shift-left = 'move-workspace-to-monitor --wrap-around prev'
shift-right = 'move-workspace-to-monitor --wrap-around next'
